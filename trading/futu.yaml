# Futu OpenAPI trading configuration.
#
# Safety defaults: everything below is OFF. The freshly cloned repository never
# connects to Futu OpenD and never places orders. Auto trading additionally
# requires `uv sync --frozen --extra futu`, a running OpenD gateway, and a
# Futu account with OpenAPI permission.
#
# mode:
#   dry  - resolve and audit orders without sending them (default)
#   live - place real orders; requires confirm_live: true
enabled: false
mode: dry
confirm_live: false
auto_trade: {}
# Example opt-in for one instrument:
# auto_trade:
#   "00700":
#     side: sell
#     quantity: 100
#     order_type: limit
#     limit_offset_pct: 0.5
#     max_orders_per_day: 1
#     cooldown_minutes: 60
