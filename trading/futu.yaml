# Offline order-intent rehearsal configuration.
#
# Alpha Guard's Futu integration is quote-only. This file can exercise rule,
# risk and order-intent calculations locally, but it never imports a broker SDK,
# connects to a trading account, or sends an order.
enabled: false
mode: dry
auto_trade: {}
# Example opt-in for one instrument:
# auto_trade:
#   "00700":
#     side: sell
#     quantity: 100
#     order_type: limit
#     limit_offset_pct: 0.5
#     max_orders_per_day: 1
#     cooldown_minutes: 60
