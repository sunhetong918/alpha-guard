[project]
name = "alpha-guard"
version = "0.3.0"
description = "A read-only, rules-based stock monitoring guard for HK and US markets"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "exchange-calendars>=4.11,<5",
    "pandas>=2.0.0",
    "platformdirs>=4.0.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40.0"]
cn-data = ["akshare>=1.14.0"]
futu = ["futu-api>=9.0"]
notifications = ["python-telegram-bot>=21.0"]
desktop = [
    "PySide6>=6.8,<7",
    "keyring>=25,<26",
]
desktop-build = ["PyInstaller==6.21.0"]
all = [
    "akshare>=1.14.0",
    "anthropic>=0.40.0",
    "futu-api>=9.0",
    "keyring>=25,<26",
    "PySide6>=6.8,<7",
    "python-telegram-bot>=21.0",
]

[project.scripts]
alpha-guard = "main:app"
alpha-guard-desktop = "desktop.app:main"
alpha-guard-guardian = "guardian.service:main"

[project.urls]
Documentation = "https://github.com/sunhetong918/alpha-guard#readme"
Issues = "https://github.com/sunhetong918/alpha-guard/issues"
Repository = "https://github.com/sunhetong918/alpha-guard"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "types-python-dateutil>=2.9.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["config", "main", "scheduler"]

[tool.setuptools.packages.find]
include = [
    "analysis*",
    "data*",
    "desktop*",
    "guardian*",
    "news*",
    "notifier*",
    "reliability*",
    "signals*",
    "state*",
    "trading*",
]

[tool.setuptools.package-data]
data = ["fixtures/*.json"]
desktop = ["assets/*.icns", "assets/*.png"]
"desktop.ui" = ["fixtures/*.json"]
news = ["config.yaml"]
signals = ["rules.yaml"]
trading = ["futu.yaml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
    "analysis",
    "config",
    "data",
    "desktop",
    "guardian",
    "main",
    "news",
    "notifier",
    "reliability",
    "scheduler",
    "signals",
    "state",
    "trading",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
