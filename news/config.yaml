# Safe repository defaults: every network source and AI filtering are disabled.
stock_keywords:
  AAPL:
    en: ["Apple", "iPhone", "iPad", "Tim Cook", "App Store"]
    zh: ["苹果公司", "苹果手机"]
  "00700":
    en: ["Tencent", "WeChat"]
    zh: ["腾讯", "微信", "游戏版号", "王者荣耀"]

macro_topics:
  - label: "货币政策"
    keywords: ["美联储", "Fed", "加息", "降息", "利率", "QE", "缩表", "鲍威尔", "Powell"]
  - label: "贸易摩擦"
    keywords: ["关税", "tariff", "贸易战", "trade war", "出口管制", "制裁", "sanctions"]
  - label: "地缘政治"
    keywords: ["台海", "Taiwan", "南海", "中美关系", "中美", "脱钩", "decoupling"]
  - label: "军事冲突"
    keywords: ["战争", "war", "军事", "military", "导弹", "missile", "冲突", "conflict"]
  - label: "科技监管"
    keywords: ["反垄断", "antitrust", "数据安全", "AI监管", "AI regulation"]
  - label: "经济数据"
    keywords: ["CPI", "PPI", "非农", "nonfarm", "GDP", "PMI", "失业率", "unemployment"]

ai_filter:
  enabled: false
  alert_threshold: 3
  max_ai_calls_per_scan: 20

sources:
  finnhub:
    enabled: false
    lookback_hours: 6
  newsapi:
    enabled: false
    lookback_hours: 12
    extra_queries: ["China stock market", "港股", "美股"]
    language: en
    page_size: 20
  akshare:
    enabled: false
