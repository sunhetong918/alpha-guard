name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: >-
          uv run mypy analysis data desktop guardian news notifier reliability signals state
          config.py scheduler.py main.py

      - name: Build and smoke installed wheel
        run: uv run pytest tests/test_packaging.py -q

      - name: Test
        run: >-
          uv run pytest --ignore=tests/test_packaging.py --cov
          --cov-report=term-missing --cov-report=xml
