name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Qt system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups --all-extras

      # The packaging test installs the built wheel with `uv pip install --offline`,
      # which resolves against cached registry metadata and newest-satisfying wheels.
      # `uv sync --frozen` seeds only the locked wheels, so resolve once online into a
      # throwaway venv to populate both; when the lock is current this is a cache hit.
      - name: Warm registry cache for offline packaging test
        run: >-
          uv venv /tmp/uv-warm && uv pip install --python /tmp/uv-warm/bin/python
          '.[desktop]'

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: >-
          uv run mypy analysis data desktop guardian news notifier reliability research signals state
          config.py scheduler.py main.py

      - name: Build and smoke installed wheel
        run: uv run pytest tests/test_packaging.py -q

      # PySide6 on Linux can die from a fatal signal (SIGSEGV/SIGABRT) during
      # interpreter teardown after the run summary is printed (Qt objects
      # outliving QApplication). Treat that specific post-success crash as
      # green; every other exit code stands.
      - name: Test
        run: |
          set +e
          uv run pytest --ignore=tests/test_packaging.py --cov \
            --cov-report=term-missing --cov-report=xml > pytest-output.log 2>&1
          status=$?
          cat pytest-output.log
          if [ "$status" -ge 128 ] \
              && grep -Eq '^=+ [0-9]+ passed' pytest-output.log \
              && ! grep -Eq '[0-9]+ failed' pytest-output.log; then
            echo "::warning::pytest exited with a fatal signal ($status) during interpreter teardown after all tests passed (PySide6 shutdown); treated as success"
            exit 0
          fi
          exit "$status"
